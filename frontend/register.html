<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ENT Preparation Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #2d3748;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Left Side - Visual Area */
        .visual-side {
            flex: 1;
            background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 50%, #4c1d95 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px;
            overflow: hidden;
        }

        /* Abstract Floating Shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: white;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.3);
            top: 50%;
            right: 15%;
            animation-delay: 5s;
        }

        .shape-3 {
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.2);
            bottom: 20%;
            left: 20%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            33% {
                transform: translate(30px, -30px) rotate(120deg);
            }
            66% {
                transform: translate(-20px, 20px) rotate(240deg);
            }
        }

        .visual-content {
            position: relative;
            z-index: 2;
            color: white;
        }

        .visual-title {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .visual-subtitle {
            font-size: 20px;
            opacity: 0.9;
            font-weight: 400;
        }

        .robot-container {
            position: relative;
            z-index: 2;
            align-self: flex-start;
            margin-top: auto;
        }

        .robot-image {
            width: 300px;
            height: auto;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
        }

        /* Right Side - Form Area */
        .form-side {
            flex: 1;
            background: #f5f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            overflow-y: auto;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
        }

        .register-card {
            background: white;
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .register-card:hover {
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.12);
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
            text-align: left;
        }

        .subtitle {
            font-size: 16px;
            color: #718096;
            text-align: left;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            color: #2d3748;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .form-input::placeholder {
            color: #a0aec0;
        }

        .signup-button {
            width: 100%;
            background: linear-gradient(135deg, #7c3aed 0%, #9f7aea 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px 0 rgba(124, 58, 237, 0.3);
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .signup-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px 0 rgba(124, 58, 237, 0.4);
        }

        .signup-button:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #718096;
        }

        .login-link a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .login-link a:hover {
            color: #9f7aea;
            text-decoration: underline;
        }

        .error-message {
            color: #e53e3e;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        /* Responsive Design */
        @media (max-width: 968px) {
            body {
                flex-direction: column;
            }

            .visual-side {
                min-height: 300px;
                padding: 40px;
            }

            .visual-title {
                font-size: 32px;
            }

            .visual-subtitle {
                font-size: 18px;
            }

            .robot-image {
                width: 200px;
            }

            .form-side {
                padding: 20px;
            }

            .register-card {
                padding: 32px 24px;
            }
        }

        @media (max-width: 480px) {
            .visual-side {
                min-height: 250px;
                padding: 30px 20px;
            }

            .visual-title {
                font-size: 24px;
            }

            .visual-subtitle {
                font-size: 16px;
            }

            .robot-image {
                width: 150px;
            }

            .title {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Left Side - Visual Area -->
    <div class="visual-side">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        
        <div class="visual-content">
            <h1 class="visual-title">Create your ENT account</h1>
            <p class="visual-subtitle">Start intelligent exam preparation</p>
        </div>

        <div class="robot-container">
            <img src="assets/robot.png" alt="AI Assistant Robot" class="robot-image">
        </div>
    </div>

    <!-- Right Side - Form Area -->
    <div class="form-side">
        <div class="register-container">
            <div class="register-card">
                <h1 class="title">Create an account</h1>
                <p class="subtitle">Sign up to get started</p>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input 
                        type="text" 
                        id="fullName" 
                        name="fullName" 
                        class="form-input" 
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        class="form-input" 
                        placeholder="Confirm your password"
                        required
                    >
                    <div id="passwordError" class="error-message">Passwords do not match</div>
                </div>

                <button type="submit" class="signup-button">Sign Up</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="login.html">Login here</a>
            </div>
            </div>
        </div>
    </div>

    <script>
        function handleRegister(event) {
            event.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMessage = document.getElementById('passwordError');

            // Validate password match
            if (password !== confirmPassword) {
                errorMessage.style.display = 'block';
                return;
            }

            errorMessage.style.display = 'none';

            // TODO: Implement actual registration logic
            // For now, just redirect to dashboard
            console.log('Registration attempt:', { fullName, email, password });
            
            // Store user info (temporary - replace with actual auth)
            localStorage.setItem('studentName', fullName);
            
            // Redirect to dashboard
            window.location.href = 'dashboard.html';
        }

        // Real-time password validation
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            const errorMessage = document.getElementById('passwordError');

            if (confirmPassword && password !== confirmPassword) {
                errorMessage.style.display = 'block';
            } else {
                errorMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
